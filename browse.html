<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:92px}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}

/* top nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.brand{font-weight:800;font-size:17px;letter-spacing:.16em}
.nlinks{display:flex;gap:18px;margin-left:8px}

.nright{margin-left:auto;display:flex;align-items:center;gap:16px}

.pillbtn{background:var(--blue);color:var(--blueink);padding:9px 16px;border-radius:30px;font-weight:700;font-size:13px}
.ct{background:var(--ink);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
/* reassurance strip */
.reassure{background:var(--ink);color:#fff}
.reassure .wrap{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-size:12.5px;font-weight:500;padding:9px 24px;letter-spacing:.01em}

/* quiz modal (full-screen, WP-style image cards) */
.modal{position:fixed;inset:0;z-index:100;background:#fff;display:none;flex-direction:column}

.modal .mtop{display:flex;align-items:center;justify-content:center;height:58px;border-bottom:1px solid var(--line);position:relative;flex:none}

.qopt{border:none;background:none;cursor:pointer;font-family:inherit}
.qopt .im{border-radius:16px;aspect-ratio:1/.82;display:grid;place-items:center;transition:.16s;border:2px solid transparent}
.qopt:hover .im{transform:translateY(-3px)}
.qopt.on .im{border-color:var(--blue)}
.qopt .im span{font-family:var(--disp);font-size:30px;font-weight:600;color:#1114}
.qopt b{display:block;font-size:16px;font-weight:700;margin-top:10px}
.qopt small{color:var(--muted);font-size:12.5px}
.qskip{margin-top:26px;background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.qresult{max-width:560px}
.qresult .rimgs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.qresult .rimgs img{width:64px;height:52px;object-fit:contain;mix-blend-mode:multiply;background:var(--panel);border-radius:8px}
.bigbtn{width:100%;max-width:360px;background:var(--blue);color:#fff;border:none;font-weight:700;font-size:15px;padding:15px;border-radius:28px;cursor:pointer;margin:7px auto 0;display:block}
.bigbtn.alt{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-weight:600;font-size:13px;padding:12px 18px;border-radius:30px;opacity:0;transition:.25s;pointer-events:none;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){
  .plp{grid-template-columns:1fr;gap:16px}
  .nlinks{display:none}
  .rail{position:fixed;inset:0;top:0;z-index:70;background:#fff;max-height:none;padding:18px 20px 90px;display:none;overflow:auto}
  .rail.show{display:block}
  .filtbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .railclose{display:block;text-align:right;font-size:22px;color:#888;cursor:pointer;margin-bottom:6px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}

}

@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.pc .nm .t{font-size:15px}.pc .buy{font-size:12px}}

<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900);}
(function(){try{const bag=JSON.parse(localStorage.getItem('upc_bag')||'[]');const n=bag.reduce((s,b)=>s+(b.q||1),0);const el=$('bagcount');if(n&&el){el.textContent=n;el.style.display='inline-block';}}catch(e){}})();
const getFavs=()=>{try{return JSON.parse(localStorage.getItem('upc_favs')||'[]')}catch(e){return[]}};
const setFavs=a=>localStorage.setItem('upc_favs',JSON.stringify(a));
const getFit=()=>{try{return JSON.parse(localStorage.getItem('upc_fit')||'null')}catch(e){return null}};
function fitVerdict(p,fit){
  if(!fit||!p.dims||!p.dims.total)return null;      // activates once frames carry real dimensions
  const d=p.dims.total-fit.target;
  if(Math.abs(d)<=2)return{cls:'ok',label:'Fits you ✓'};
  if(d>2)return{cls:'lg',label:'Runs large'};
  return{cls:'sm',label:'Runs small'};
}
const stripNum=s=>(s||'').replace(/\s*\d+\s*$/,'').trim();
const modelKey=p=>p.b+'|'+((stripNum(p.model||p.n)||(p.model||p.n)).toUpperCase());
const displayModel=p=>stripNum(p.model||p.n)||(p.model||p.n);
const colorName=p=>{const b=displayModel(p);let c=(p.n||'').trim();if(c.toUpperCase().startsWith(b.toUpperCase()))c=c.slice(b.length).trim();return c||(p.n||'');};
const szImg=(u,w)=>!u?'':u.includes('lh3.googleusercontent')?u.replace(/=w\d+$/,'')+'=w'+w:(u.split('?')[0]+'?width='+w);
// vibrant color-block tiles behind frames
const TILES=['#CAD7FF','#FFC9B8','#9FE6D4','#D9C6FF','#FFE08A','#A9DEF9','#FFC2D4','#BDEBC6','#FFD1A6','#C9E8FF'];
const hashIdx=h=>{let s=0;for(let i=0;i<h.length;i++)s=(s*31+h.charCodeAt(i))>>>0;return s;};
const HCOL={Portrait:'#2B4BF2',Acid:'#FF6A2B',Parasite:'#7B4DFF'};
const HMETA={Portrait:'Premium · Handmade in Italy',Acid:'Designer · France · by Hugo Martin',Parasite:'Futurist · France · handcrafted'};
const HKICK={Portrait:'Italian premium',Acid:'French design',Parasite:'Avant-garde'};
const COLS={
  Portrait:[['essential','Essential'],['editorial','Editorial'],['metal','Metal']],
  Acid:[['acetate','Acetate'],['metal','Metal'],['boost','Boost'],['premium','Premium']],
  Parasite:[['signature','Icons'],['lab','Lab']],
};
function matchCol(p,k){if(k==='all')return true;if(k==='signature')return !(p.cols&&p.cols.length);return p.cols&&p.cols.includes(k);}
/* color families */
const CFAM=[
  ['black','Black','#1a1a1a'],['tortoise','Tortoise','#6b4323'],['crystal','Crystal','#dfe6ea'],
  ['brown','Brown','#7a5230'],['green','Green','#3f6f4a'],['blue','Blue','#395a9e'],
  ['grey','Grey','#8b9199'],['havana','Havana','#5a3a1e'],['red','Red/Pink','#b5424e'],
  ['clear','Clear/Nude','#eadfce'],['gold','Gold','#c6a15b'],['silver','Silver','#b9bfc6'],
];
function famOf(p){const c=colorName(p).toLowerCase();for(const [k] of CFAM){if(k==='red'){if(/red|pink|bordeaux|burgundy|rose/.test(c))return 'red';}else if(k==='crystal'){if(/crystal|clear|transparent/.test(c))return 'crystal';}else if(k==='clear'){if(/nude|milk|beige|sand|tan/.test(c))return 'clear';}else if(c.includes(k))return k;}return null;}

let DATA=[],house=Q.get('b')||'Portrait',type=Q.get('t')||'Sunglasses';
let F={col:'all',fams:new Set(),price:'all',shopnew:false,q:''},sort='feat';
if(!['Portrait','Acid','Parasite'].includes(house))house='Portrait';
if(!['all','Eyeglasses','Sunglasses','Readers'].includes(type))type='Sunglasses';

fetch('products.json').then(r=>r.json()).then(d=>{
  DATA=d;buildNav();buildFilters();render();renderPick();
  if(Q.get('adrian')==='1')openQuiz();
});

function buildNav(){
  $('nlinks').innerHTML=['Portrait','Acid','Parasite'].map(h=>`<a href="#" data-h="${h}" class="${h===house?'on':''}">${h}</a>`).join('');
  $('nlinks').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();house=a.dataset.h;F.col='all';F.fams.clear();buildNav();buildFilters();render();});
  document.documentElement.style.setProperty('--hc',HCOL[house]||'#2B4BF2');
  $('kick').textContent=HKICK[house]||'The club';$('hname').textContent=house;$('hmeta').textContent=HMETA[house];
}
function priceOpts(){return [['all','All prices'],['u150','Under $150'],['150','$150 – $250'],['250','$250 – $400'],['400','$400 +']];}
function inPrice(p){const v=p.p;switch(F.price){case 'u150':return v<150;case '150':return v>=150&&v<250;case '250':return v>=250&&v<400;case '400':return v>=400;default:return true;}}

function buildFilters(){
  const typeOpts=[['Sunglasses','Sunglasses'],['Readers','Readers'],['Eyeglasses','Optical'],['all','All frames']];
  let h='';
  h+=`<div class="fg"><h5>Category</h5>${typeOpts.map(t=>`<label class="opt"><input type="radio" name="ty" ${t[0]===type?'checked':''} data-t="${t[0]}">${t[1]}</label>`).join('')}</div>`;
  h+=`<div class="fg"><h5>Collection</h5><label class="opt"><input type="radio" name="col" ${F.col==='all'?'checked':''} data-c="all">All</label>${COLS[house].map(c=>`<label class="opt"><input type="radio" name="col" ${F.col===c[0]?'checked':''} data-c="${c[0]}">${c[1]}</label>`).join('')}</div>`;
  h+=`<div class="fg"><h5>Color</h5><div class="cfam">${CFAM.map(c=>`<button data-f="${c[0]}" class="${F.fams.has(c[0])?'on':''}"><span class="sw" style="background:${c[2]}"></span>${c[1]}</button>`).join('')}</div></div>`;
  h+=`<div class="fg"><h5>Price</h5>${priceOpts().map(p=>`<label class="opt"><input type="radio" name="pr" ${F.price===p[0]?'checked':''} data-p="${p[0]}">${p[1]}</label>`).join('')}</div>`;
  h+=`<div class="fg"><h5>Shop by</h5><label class="opt"><input type="checkbox" style="border-radius:5px" ${F.shopnew?'checked':''} id="newonly">New arrivals</label><button class="clearf" id="clearf">Clear all filters</button></div>`;
  $('filters').innerHTML=h;
  $('filters').querySelectorAll('input[name=ty]').forEach(r=>r.onchange=()=>{type=r.dataset.t;render();});
  $('filters').querySelectorAll('input[name=col]').forEach(r=>r.onchange=()=>{F.col=r.dataset.c;render();});
  $('filters').querySelectorAll('input[name=pr]').forEach(r=>r.onchange=()=>{F.price=r.dataset.p;render();});
  $('filters').querySelectorAll('.cfam button').forEach(b=>b.onclick=()=>{const f=b.dataset.f;F.fams.has(f)?F.fams.delete(f):F.fams.add(f);b.classList.toggle('on');render();});
  $('newonly').onchange=e=>{F.shopnew=e.target.checked;render();};
  $('clearf').onclick=()=>{F.col='all';F.fams.clear();F.price='all';F.shopnew=false;F.q='';$('q').value='';buildFilters();render();};
}

function baseList(){
  const tf=type==='Readers'?'Eyeglasses':type;
  let l=DATA.filter(p=>p.b===house&&(type==='all'||p.t===tf)&&matchCol(p,F.col)&&inPrice(p));
  if(F.fams.size)l=l.filter(p=>{const f=famOf(p);return f&&F.fams.has(f);});
  if(F.shopnew)l=l.filter(p=>p.new);
  if(F.q){const q=F.q.toLowerCase();l=l.filter(p=>(p.n||'').toLowerCase().includes(q)||(p.model||'').toLowerCase().includes(q));}
  // dedupe to one card per model
  const seen=new Set(),out=[];l.forEach(p=>{const k=modelKey(p);if(!seen.has(k)){seen.add(k);out.push(p);}});
  return out;
}
function colorways(p){return DATA.filter(x=>modelKey(x)===modelKey(p));}
function sortList(l){const a=l.slice();
  if(sort==='plo')a.sort((x,y)=>x.p-y.p);
  else if(sort==='phi')a.sort((x,y)=>y.p-x.p);
  else if(sort==='az')a.sort((x,y)=>displayModel(x).localeCompare(displayModel(y)));
  else if(sort==='new')a.sort((x,y)=>(y.new?1:0)-(x.new?1:0));
  return a;}

const TAGCOL={Portrait:'var(--blue)',Acid:'var(--tang)',Parasite:'var(--lilac)'};
function render(){
  // empty-filter fallback on category only
  let list=baseList();
  if(!list.length&&(F.col!=='all'||F.fams.size||F.price!=='all'||F.shopnew||F.q)){ /* keep filters, show empty */ }
  else if(!list.length){for(const t of ['Sunglasses','Eyeglasses','all']){if(t===type)continue;const pv=type;type=t;list=baseList();if(list.length){buildFilters();break;}type=pv;}}
  list=sortList(list);
  $('cnt').innerHTML=`<b>${list.length}</b> frame${list.length===1?'':'s'}`;
  const favs=getFavs();
  const FIT=getFit();
  $('fitbanner').innerHTML=FIT?`<div class="fb">📐 Your fit: <b>${FIT.size}</b> · face ${FIT.face}mm${FIT.roundUp?' · rounding up on borderline':''} — frames sized to you.<a href="fitfinder.html">Re-measure</a></div>`:'';
  if(!list.length){$('grid').innerHTML='<div class="empty">No frames match these filters.<br><button class="clearf" onclick="document.getElementById(\'clearf\').click()">Clear filters</button></div>';return;}
  $('grid').innerHTML=list.map(p=>{
    const cw=colorways(p),cwN=cw.length,fav=favs.includes(p.h);
    const fv=fitVerdict(p,FIT);
    const sw=cwN>1?`<div class="sw">${cw.slice(0,5).map(c=>`<button class="s${c.h===p.h?' on':''}" data-h="${c.h}" data-model="${modelKey(p)}"><img src="${szImg(c.img,60)}" alt=""></button>`).join('')}${cwN>5?`<span class="more">+${cwN-5}</span>`:''}</div>`:'';
    const sun=p.t==='Sunglasses';
    const buy=sun?`<a class="buy blue" href="rx.html?h=${p.h}&use=sun">Add sun lenses →</a>`:`<a class="buy blue" href="rx.html?h=${p.h}${type==='Readers'?'&use=readers':''}">Select lenses →</a>`;
    return `<div class="pc" data-model="${modelKey(p)}" data-h="${p.h}">
      <div class="frame" style="background:${TILES[hashIdx(p.h)%TILES.length]}">
        ${p.new?`<span class="tag" style="background:${TAGCOL[p.b]}">New</span>`:''}
        <button class="heart${fav?' on':''}" data-h="${p.h}" title="Save">${fav?'♥':'♡'}</button>
        <img src="${szImg(p.img,460)}" alt="${p.n}" loading="lazy">
        <button class="tryon" data-h="${p.h}">◉ Try on</button>
      </div>
      <div class="nm"><span class="t">${displayModel(p)}</span><span class="pr">$${p.p}</span></div>
      <div class="sub">${sun?'Sunglasses':'Optical'}${cwN>1?' · '+cwN+' colors':''}</div>
      ${fv?`<span class="fitb ${fv.cls}">${fv.label}</span>`:''}
      ${sw}${buy}
    </div>`;
  }).join('');
  // wire cards
  $('grid').querySelectorAll('.heart').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleFav(b.dataset.h);});
  $('grid').querySelectorAll('.tryon').forEach(b=>b.onclick=e=>{e.preventDefault();if(!getFavs().includes(b.dataset.h))doFav(b.dataset.h,true,true);location.href='tryon3d.html?h='+encodeURIComponent(b.dataset.h);});
  $('grid').querySelectorAll('.sw .s').forEach(s=>s.onclick=e=>{e.preventDefault();
    const np=DATA.find(x=>x.h===s.dataset.h);const card=s.closest('.pc');
    card.querySelector('.frame img').src=szImg(np.img,460);
    card.querySelector('.heart').dataset.h=np.h;card.querySelector('.tryon').dataset.h=np.h;
    const fav=getFavs().includes(np.h);const ht=card.querySelector('.heart');ht.classList.toggle('on',fav);ht.textContent=fav?'♥':'♡';
    card.querySelector('.buy').href=(np.t==='Sunglasses'?`rx.html?h=${np.h}&use=sun`:`rx.html?h=${np.h}`);
    card.querySelectorAll('.sw .s').forEach(x=>x.classList.toggle('on',x===s));
    card.dataset.h=np.h;
  });
}
$('sort').onchange=()=>{sort=$('sort').value;render();};
$('q').oninput=()=>{F.q=$('q').value.trim();render();};
$('filtbtn').onclick=()=>$('rail').classList.add('show');
$('railclose').onclick=()=>$('rail').classList.remove('show');

function toggleFav(h){doFav(h,!getFavs().includes(h));render();renderPick();}
function doFav(h,on,quiet){let f=getFavs();if(on){if(!f.includes(h))f.push(h);if(!quiet)toast('Saved to your picks ♥');}else{f=f.filter(x=>x!==h);}setFavs(f);renderPick();}

function renderPick(){
  const f=getFavs();$('pickn').textContent=f.length;$('savedn').textContent=f.length;
  $('pickmini').innerHTML=f.slice(-5).map(h=>{const p=DATA.find(x=>x.h===h);return p?`<img src="${szImg(p.img,80)}">`:'';}).join('');
  $('pickcar').style.display=f.length?'inline':'none';
  const go=$('tryon');
  if(f.length){go.classList.remove('dim');go.textContent='Try '+f.length+' at home →';go.onclick=()=>location.href='trunk.html';}
  else{go.classList.add('dim');go.textContent='Heart some first';go.onclick=()=>toast('Tap ♡ on frames you like');$('pickpanel').classList.remove('show');}
  const pp=$('pickpanel');
  if(f.length){pp.innerHTML='<div class="ph">Your picks — tap remove to delete</div>'+f.map(h=>{const p=DATA.find(x=>x.h===h);if(!p)return '';return `<div class="prow"><img src="${szImg(p.img,110)}"><div class="pn">${displayModel(p)}<small>${colorName(p)} · $${p.p}</small></div><button class="rm" data-h="${h}">Remove ✕</button></div>`;}).join('');
    pp.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{doFav(b.dataset.h,false);toast('Removed');render();});}
}
$('picklbl').onclick=()=>{if(getFavs().length)$('pickpanel').classList.toggle('show');};
$('savedlink').onclick=e=>{e.preventDefault();if(getFavs().length)$('pickpanel').classList.toggle('show');else toast('No saved frames yet');};

/* ---------- Style quiz (WP-style, image cards) ---------- */
const QUIZ=[
  {k:'type',q:'What are you looking for?',o:[['Sunglasses','Sunglasses','Tinted / UV','var(--tang)'],['Eyeglasses','Eyeglasses','Prescription / clear','var(--blue)'],['all','Both','Show me everything','var(--teal)']]},
  {k:'vibe',q:"What's your vibe?",o:[['understated','Understated','Clean & everyday','var(--teal)'],['statement','Statement','Bold, get noticed','var(--coral)'],['avant','Avant-garde','Sculptural & futurist','var(--lilac)']]},
  {k:'face',q:'Your face shape?',o:[['round','Round','Softer, fuller','var(--blue)'],['square','Square','Strong, angular','var(--tang)'],['oval','Oval / long','Balanced, longer','var(--teal)'],['unsure','Not sure','Surprise me','var(--lilac)']]},
  {k:'house',q:'A house in mind?',o:[['any','Any house','Best of all three','var(--blue)'],['Portrait','Portrait','Italian premium','var(--teal)'],['Acid','Acid','French design','var(--tang)'],['Parasite','Parasite','Futurist','var(--lilac)']]},
];
let ans={},qi=0;
function openQuiz(){qi=0;ans={};$('modal').classList.add('show');renderQuiz();}
function closeQuiz(){$('modal').classList.remove('show');}
$('quizbtn').onclick=openQuiz;$('qx').onclick=closeQuiz;
function renderQuiz(){
  const s=QUIZ[qi];
  $('msheet').innerHTML=`<div class="step">${qi+1} of ${QUIZ.length}</div><h3>${s.q}</h3>
    <div class="qopts">${s.o.map(o=>`<button class="qopt" data-v="${o[0]}"><div class="im" style="background:color-mix(in srgb, ${o[3]} 14%, #fff);box-shadow:inset 0 0 0 2px color-mix(in srgb, ${o[3]} 30%, #fff)"><span style="color:${o[3]}">${o[1][0]}</span></div><b>${o[1]}</b><small>${o[2]}</small></button>`).join('')}</div>
    <button class="qskip" id="qskip">I'm not sure. Skip it.</button>`;
  $('msheet').querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{ans[s.k]=b.dataset.v;qi++;qi<QUIZ.length?renderQuiz():finishQuiz();});
  $('qskip').onclick=()=>{qi++;qi<QUIZ.length?renderQuiz():finishQuiz();};
}
const VIBECOLS={understated:['essential','acetate','signature'],statement:['editorial','boost'],avant:['lab','premium','metal']};
function finishQuiz(){
  let pool=DATA.slice();
  if(ans.house&&ans.house!=='any')pool=pool.filter(p=>p.b===ans.house);
  if(ans.type&&ans.type!=='all')pool=pool.filter(p=>p.t===ans.type);
  const vc=VIBECOLS[ans.vibe]||[];let matched=pool.filter(p=>vc.some(k=>matchCol(p,k)));
  if(matched.length<6)matched=pool;
  const seen=new Set(),uniq=[];matched.sort(()=>Math.random()-0.5).forEach(p=>{const k=modelKey(p);if(!seen.has(k)){seen.add(k);uniq.push(p);}});
  const pick=uniq.slice(0,6);let f=getFavs();pick.forEach(p=>{if(!f.includes(p.h))f.push(p.h);});setFavs(f);renderPick();
  $('msheet').innerHTML=`<div class="qresult"><div class="step">Your shortlist</div><h3>6 frames, picked for you</h3>
    <p style="color:var(--muted);font-size:14.5px">Saved to your picks. See them on your face, or browse first.</p>
    <div class="rimgs">${pick.map(p=>`<img src="${szImg(p.img,120)}" title="${p.n}">`).join('')}</div>
    <button class="bigbtn" id="qtry">Try my ${pick.length} picks on →</button>
    <button class="bigbtn alt" id="qbrowse">Browse them first</button></div>`;
  $('qtry').onclick=()=>location.href='tryon3d.html?picks=1';
  $('qbrowse').onclick=()=>{closeQuiz();if(ans.house&&ans.house!=='any')house=ans.house;if(ans.type)type=ans.type;F.col='all';F.fams.clear();buildNav();buildFilters();render();toast('Your picks are hearted ♥');};
}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeQuiz();});
</script>
<script src="/mk.js"></script>
</body></html>
